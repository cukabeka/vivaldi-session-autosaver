<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#2b5fd9"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce9ff"/>
    </linearGradient>
  </defs>
  <!-- rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- circular arrow (refresh/backup) -->
  <g transform="translate(256 256)">
    <path d="M 0 -150 A 150 150 0 1 1 -129.9 75"
          fill="none" stroke="url(#arrow)" stroke-width="52" stroke-linecap="round"/>
    <path d="M -190 30 L -66 30 L -128 130 Z" fill="url(#arrow)"/>
  </g>
  <!-- clock hands: indicates point-in-time snapshots -->
  <g stroke="#2b5fd9" stroke-width="34" stroke-linecap="round">
    <line x1="256" y1="256" x2="256" y2="176"/>
    <line x1="256" y1="256" x2="316" y2="296"/>
  </g>
  <circle cx="256" cy="256" r="26" fill="#2b5fd9"/>
</svg>
